<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Draft Lottery</title>

<style>

body{
    font-family: Segoe UI, Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#0f172a;
    color:white;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

h1,h2,h3{
    margin-top:0;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#334155;
}

th,td{
    padding:10px;
    border-bottom:1px solid #475569;
}

input,
select{
    width:100%;
    padding:8px;
    background:#334155;
    color:white;
    border:1px solid #475569;
    border-radius:6px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

#startDraw{
    width:100%;
    font-size:1.5rem;
    padding:20px;
    background:#22c55e;
}

.pick-card{
    background:#0f172a;
    border:1px solid #475569;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
    text-align:center;
}

.pick-number{
    font-size:0.9rem;
    color:#94a3b8;
}

.pick-name{
    font-size:2rem;
    font-weight:bold;
    margin-top:8px;
}

.settings{
    display:none;
}

.settings.open{
    display:block;
}

</style>
</head>

<body>

<div class="card">

<h1>Fantasy Draft Lottery</h1>

<button id="toggleSettings">
Settings
</button>

<div id="settingsPanel" class="settings">

<h3>Animation</h3>

<label>
Reveal Style
<select id="revealStyle">
<option>Smooth</option>
<option>Sequential</option>
<option>Historical</option>
</select>
</label>

<br><br>

<label>
Animation Speed
<select>
<option>Fast</option>
<option selected>Normal</option>
<option>Slow</option>
</select>
</label>

</div>

</div>

<div class="card">

<h2>Lottery Entries</h2>

<table>

<thead>
<tr>
<th>Manager</th>
<th>Entries</th>
<th></th>
</tr>
</thead>

<tbody id="teamTable">
</tbody>

</table>

<button id="addTeam">
Add Manager
</button>

<div id="entryTotal"></div>

</div>

<div class="card">

<h2>Simulation</h2>

<button id="sim1000">
Run 1,000 Simulations
</button>

<button id="sim10000">
Run 10,000 Simulations
</button>

<div id="simulationResults"></div>

</div>

<div class="card">

<h2>Draft Draw</h2>

<button id="startDraw">
START DRAW
</button>

<div id="drawResults"></div>

</div>

<script>

const teamTable = document.getElementById("teamTable");

const startingTeams = [
["Shane",12],
["Alex",8],
["Kyle",6],
["Thomas",4],
["Tyrone",2],
["Charlie",1]
];

function addRow(name="", entries=10){

const tr=document.createElement("tr");

tr.innerHTML=`
<td>
<input type="text" value="${name}">
</td>

<td>
<input type="number" min="1" value="${entries}">
</td>

<td>
<button class="remove">
Remove
</button>
</td>
`;

tr.querySelector(".remove").onclick=()=>{
tr.remove();
};

teamTable.appendChild(tr);

}

function updateTotal(){

    const total =
        getTeams()
        .reduce(
            (sum,t)=>sum+t.weight,
            0
        );

    document
        .getElementById("entryTotal")
        .innerHTML =
        `<strong>Total Entries:</strong> ${total}`;

}

startingTeams.forEach(t=>addRow(t[0],t[1]));

document.getElementById("addTeam")
.onclick=()=>{
addRow("New Manager",10);
};

function getTeams(){

return [...teamTable.children]
.map(row=>({

name:
row.cells[0]
.querySelector("input").value,

weight:
Number(
row.cells[1]
.querySelector("input").value)

}))
.filter(t=>t.weight>0);

}

function weightedPick(pool){

const total=
pool.reduce((s,p)=>
s+p.weight,0);

let r=Math.random()*total;

for(let i=0;i<pool.length;i++){

r-=pool[i].weight;

if(r<=0){
return i;
}

}

return 0;

}

function weightedOrder(data){

let pool=structuredClone(data);

let order=[];

while(pool.length){

const idx=
weightedPick(pool);

order.push(pool[idx]);

pool.splice(idx,1);

}

return order;

}

function runSimulation(count){

const teams=getTeams();

const wins={};

teams.forEach(
t=>wins[t.name]=0
);

for(let i=0;i<count;i++){

const winner=
weightedOrder(teams)[0];

wins[winner.name]++;

}

const totalWeight =
teams.reduce(
(sum,t)=>sum+t.weight,
0
);

let html = `
<h3>Pick #1 Odds</h3>

<table>
<tr>
<th>Manager</th>
<th>Entries</th>
<th>Theoretical</th>
<th>Simulated</th>
</tr>
`;

teams.forEach(team=>{

const simulated =
((wins[team.name]/count)*100)
.toFixed(2);

const theoretical =
((team.weight/totalWeight)*100)
.toFixed(2);

html += `
<tr>
<td>${team.name}</td>
<td>${team.weight}</td>
<td>${theoretical}%</td>
<td>${simulated}%</td>
</tr>
`;

});

html += "</table>";

document
.getElementById(
"simulationResults")
.innerHTML = html;

}

document
.getElementById("sim1000")
.onclick=()=>runSimulation(1000);

document
.getElementById("sim10000")
.onclick=()=>runSimulation(10000);

document
.getElementById("startDraw")
.onclick = async () => {

    const result = weightedOrder(getTeams());

    const container =
        document.getElementById("drawResults");

    container.innerHTML = "";

    for(let i = 0; i < result.length; i++){

        await new Promise(resolve =>
            setTimeout(resolve, 1500)
        );

        const card =
            document.createElement("div");

        card.className = "pick-card";

        card.innerHTML = `
            <div class="pick-number">
                PICK #${i+1}
            </div>
            <div class="pick-name">
                ${result[i].name}
            </div>
        `;

        container.appendChild(card);

        card.scrollIntoView({
            behavior:"smooth",
            block:"end"
        });

    }

};

document
.getElementById(
"toggleSettings")
.onclick=()=>{

document
.getElementById(
"settingsPanel")
.classList
.toggle("open");

};

</script>

</body>
</html>
